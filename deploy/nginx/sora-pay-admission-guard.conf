# Include inside the customer /sora-pay/v1/ proxy location.
# Do not initialize this variable here: a missing http map must fail nginx -t.
# Only return is used inside if; all proxy directives remain at location scope.
# Reject ambiguous paths: Node's URL parser treats backslashes as separators.
if ($uri ~ "\\\\") {
    return 400;
}

if ($sora_pay_admission_blocked) {
    return 503;
}
