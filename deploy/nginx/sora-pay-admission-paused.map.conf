# Include exactly one admission map in nginx's http context.
# $uri is nginx's normalized path; query strings are deliberately excluded.
# Case-sensitive regex keys preserve the relay's exact method/path contract.
map "$request_method:$uri" $sora_pay_admission_blocked {
    default 0;
    "~^POST:/sora-pay/v1/orders$" 1;
    "~^POST:/sora-pay/v1/orders/[a-f0-9-]{36}/payment-attempt$" 1;
}
